# YOLO11 with an added P2/4 detection level, for tiny aerial persons.
#
# WHY THIS FILE EXISTS
# --------------------
# Ultralytics 8.3.253 ships yolov8-p2.yaml but NO YOLO11 P2 variant --
# .venv/lib/python3.12/site-packages/ultralytics/cfg/models/11/ has none. This adapts
# the v8-p2 head onto the YOLO11 backbone.
#
# Motivation, measured on this project's data: at 640 input the finest stock level is
# P3/8, so an 8x8 px person collapses to a single 1x1 feature cell before the head ever
# sees it. VisDrone train persons are mean 20.88 px with 9.7 percent under 8 px, and the
# test split is worse -- mean 14.68 px with 31.3 percent under 8 px. Chen et al. 2026
# (references/pdfs/Chen2026_sdd-yolo-small-target.pdf, Table 2) report a P2 level taking
# mAP50 0.786 -> 0.849 and recall 0.723 -> 0.800 at identical parameter count and FLOPs.
#
# THE ONE TRAP
# ------------
# yolov8-p2.yaml concatenates the head's P5 branch with layer 9 (SPPF). YOLO11 inserts
# C2PSA after SPPF, so the P5 tap here must be **layer 10**, not 9. Using 9 builds a
# valid graph that trains happily and is quietly worse. Backbone taps for this file:
#   P2 = layer 2, P3 = layer 4, P4 = layer 6, P5 = layer 10.
#
# VERIFY BEFORE TRAINING: the built model must report stride [4, 8, 16, 32] and its
# Detect layer must take four inputs. A misrouted Concat still prints a clean summary.

# Parameters
nc: 3 # person, vehicle, two_wheeler (overridden by the dataset yaml at train time)
scales: # scale letter is parsed from the filename stem, e.g. yolo11n-p2 -> 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11 backbone -- byte-identical to stock yolo11.yaml, so COCO weights transfer whole
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2   <- P2 tap
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4   <- P3 tap
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6   <- P4 tap
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10  <- P5 tap (NOT 9 -- see THE ONE TRAP above)

# YOLO11-p2 head: top-down to P2/4, then bottom-up back to P5/32
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12  cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15  cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18  cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21  cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24  cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27  cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # 29 Detect(P2, P3, P4, P5)
