# WiSARD fine-tuning split. Generated by scripts/22_build_wisard_finetune_split.py.
#
# Separate from configs/sar_wisard_tiled.yaml, which is the ZERO-SHOT evaluation set
# and must keep pointing every key at images/test. The published cross-domain numbers
# depend on that file; do not merge the two.
#
# Splits are sequence-disjoint and balanced on person-box count, not tile count.
# Paths are .txt lists into the existing tile directory, so nothing is duplicated and
# labels resolve by the standard /images/ -> /labels/ substitution.
#
# Declared with the full 3-class RGB label space because the checkpoints carry nc=3.
# WiSARD is person-only, so classes 1 and 2 have zero ground truth and any correct
# vehicle detection scores as a false positive. Only the PERSON row is meaningful.
path: sar-drone-data/processed/sar_wisard_ft
train: train.txt
val: val.txt
test: test.txt
names:
  0: person
  1: vehicle
  2: two_wheeler
